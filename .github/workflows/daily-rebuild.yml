# Rebuilds the site every morning so the Google rating and reviews stay current.
# Setup: in your host create a "deploy hook" / "build hook" URL
#   (Netlify: Site settings → Build hooks · Vercel: Project → Settings → Git → Deploy Hooks ·
#    Cloudflare Pages: Settings → Builds → Deploy hooks)
# and save it in GitHub → Settings → Secrets → Actions as DEPLOY_HOOK_URL.
name: Daily rebuild (Google reviews)

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC ≈ 05:00/06:00 in Poland
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then echo "DEPLOY_HOOK_URL secret is not set"; exit 1; fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
